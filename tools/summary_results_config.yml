summary:
  title: "Summary Results"
  include_development_history: false
  include_current_implementation_specification: false

population:
  immovable_cultural_properties:
    counting_unit: record
    include_point_hazard_assignment: true
    include_plateau_building_hazard_assignment: true
  movable_cultural_properties:
    treatment: separate_table

designation_level:
  categories:
    - National
    - Tokyo Metropolitan
    - Municipal

seismic:
  scenarios:
    - 都心南部直下地震
    - 都心東部直下地震
    - 都心西部直下地震
    - 大正関東地震
    - 南海トラフ巨大地震
  classes:
    - "5弱未満"
    - "5弱"
    - "5強"
    - "6弱"
    - "6強以上"

inundation:
  classes_m:
    - "0"
    - "0–0.5 m"
    - "0.5–3 m"
    - "3–5 m"
    - "5 m以上"
  types:
    - inundation_forecast
    - storm_surge
    - tsunami

maps:
  overview:
    renderer: render_summary_maps.py
    regions:
      - mainland_tokyo
      - izu_islands
      - ogasawara_islands
    seismic_scenarios:
      - 都心南部直下地震
      - 都心東部直下地震
      - 都心西部直下地震
      - 多摩東部直下地震
      - 多摩西部直下地震
      - 立川断層帯地震
      - 大正関東地震
      - 南海トラフ巨大地震

  detail:
    zoom: 16
    radius_km: 0.8
    basemap: "GSI pale map"
    non_inundation_renderer: render_city_hazard_focus.py
    inundation_renderer: render_inundation_map.py
    show_heritage_points: true
    show_building_footprints: true
    centers:
      - name: 東京駅
        lat: 35.68126
        lon: 139.76671
      - name: 東京都立上野高校
        lat: 35.7186246
        lon: 139.7698412
      - name: JR両国駅
        lat: 35.6957371
        lon: 139.7936379
      - name: 東京メトロ田原町駅
        lat: 35.70984
        lon: 139.79076

  city:
    non_inundation_renderer: render_city_hazard_focus.py
    inundation_renderer: render_inundation_map.py

  additional:
    - risk_assigned_cultural_type_distribution
    - point_distribution_by_hazard_type

sources:
  derive_from:
    - source_license
    - hazard_source_manifest
