cultural:
  recursive: false
  input_crs: "EPSG:4326"

  # Common Japanese column names are auto-detected.
  columns: {}
  file_overrides: {}

  # Semantic classification.
  # v0.5: movable types keep entity_class=movable for filtering, but are no
  # longer address-grouped or handled by a separate matching path.
  # Types not listed here are retained as representative points.
  type_class_map:
    "建造物": "building_direct"
    "美術工芸品": "movable"
    "考古資料": "movable"
    "古文書": "movable"
    "典籍": "movable"
    "美術工芸品・考古資料": "movable"
  default_entity_class: "point"

  geometry_columns: ["geometry", "geom", "wkt", "WKT", "範囲", "ポリゴン"]

plateau:
  api_base: "https://api.plateauview.mlit.go.jp"
  timeout_s: 120
  # Separate connect/read timeouts for large GML downloads.
  connect_timeout_s: 30
  read_timeout_s: 180
  download_retries: 3
  retry_backoff_s: 2.0
  cache_dir: ".cache/plateau"
  local_dir: null
  catalog_file: null
  use_geocoding_condition_for_unlocated: false

matching:
  # No buffer, radius, nearest-neighbour or cultural area is created.
  point_in_building: true

  # Only building_direct records may use these exact semantic matches.
  building_direct_exact_name: true
  building_direct_exact_address: true

  # Exact coordinates shared by multiple records in one Complex are not used
  # for Building matching by default (they are often site representative points).
  match_shared_complex_coordinates: false

output:
  dir: "output"
  subset_gml_name: "heritage_buildings.gml"
  heritage_json_name: "heritage_entities.json"
  heritage_xml_name: "heritage_entities.xml"
  gpkg_name: "heritage.gpkg"
  embed_generic_attributes: true

# In a 2-digit prefecture batch, failed PLATEAU downloads are recorded per
# municipality and processing continues. Re-run with --resume to retry only
# failed/not-yet-completed municipalities.
