version: 0.2.1
purpose: classify already-acquired Tokyo/national/municipal cultural records before
  first Heritage-GML/GPKG generation; also supports attribute-only patching of existing
  outputs
recommended_municipal_input: municipal_all_normalized.csv
municipal_output_split:
  municipal_classified.csv: designation_level_code=municipal only; use as Heritage-GML
    input
  municipal_classified_cross_level.csv: national/prefectural records found in municipal-source
    datasets; exclude from municipal input to avoid duplicates
  municipal_classified_needs_review.csv: designation level unresolved after source
    rules and exact cross-source reference matching
  municipal_all_classified.csv: all municipal-source records with classification attributes
cross_source_resolution:
  method: exact normalized cultural-property name + municipality code only
  national_reference: national_classified.csv
  prefectural_reference: 130001_cultural_property_classified.csv
  no_fuzzy_matching: true
  no_spatial_nearest_or_buffer: true
fields_to_append:
- designation_level_code
- designation_level_ja
- designation_status_code
- designation_status_ja
- heritage_type_major_code
- heritage_type_major_ja
- heritage_type_detail
- classification_confidence
unresolved_policy: do not guess; leave unknown and route to review
gpkg_gml_policy: classification metadata does not alter geometry, PLATEAU matching,
  or Complex grouping
